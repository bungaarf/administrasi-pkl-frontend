        max-width: 800px;
        margin: 0 auto;
        padding: 2rem 1rem;
      }

      .portal-card {
        background: white;
        padding: 2rem;
        border-radius: 15px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        flex: 1 1 250px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .portal-card h2 {
        color: #3dbff0;
        margin-bottom: 1rem;
        font-size: 1.25rem;
      }

      .portal-card a {
        background-color: #3dbff0;
        color: white;
        padding: 0.6rem 1.2rem;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 500;
        transition: background-color 0.3s;

      .portal-card a:hover {
