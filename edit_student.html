<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Student</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css">
  <link rel="stylesheet" href="./src/css/edit_student.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div class="app-container">
  <div class="sidebar">
    <!-- Sidebar sama seperti di halaman utama -->
  </div>

  <div class="app-content">
    <div class="app-content-header">
      <h1 class="app-content-headerText">Edit Siswa</h1>
      <button class="mode-switch" title="Switch Theme">
        <svg class="moon" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" width="24" height="24" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
        </svg>
      </button>
      <button class="app-content-headerButton" onclick="window.location.href='staff.html'">Back to Data Siswa</button>
    </div>
    
    <div class="student-form-container">
      <form id="editStudentForm" class="student-form">
        <div class="form-section">
          <h2 class="form-section-title">Informasi Siswa</h2>
          
          <div class="form-row">
            <div class="form-group">
              <label for="nis" class="form-label">NIS</label>
              <input type="text" id="nis" name="nis" class="form-input" required readonly>
            </div>
            
            <div class="form-group">
              <label for="name" class="form-label">Nama Lengkap</label>
              <input type="text" id="name" name="name" class="form-input" required>
            </div>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label for="class" class="form-label">Kelas</label>
              <select id="class" name="class" class="form-select" required>
                <option value="" disabled>Pilih Kelas</option>
                <option value="X">X</option>
                <option value="XI">XI</option>
                <option value="XII">XII</option>
              </select>
            </div>

            <div class="form-group">
              <label for="jurusan" class="form-label">Jurusan</label>
              <input type="text" id="jurusan" name="jurusan" class="form-input" placeholder="Isi jurusan" required>
            </div>

            <div class="form-group">
              <label class="form-label">Status Pembayaran</label>
              <div class="status-options">
                <label class="status-option">
                  <input type="radio" name="status" value="lunas" required>
                  <span class="status-option-label paid">Lunas</span>
                </label>
                <label class="status-option">
                  <input type="radio" name="status" value="belum lunas">
                  <span class="status-option-label unpaid">Belum Lunas</span>
                </label>
              </div>
            </div>
          </div>

        
        <div class="form-actions">
          <button type="button" class="form-button cancel" onclick="window.location.href='staff.html'">Cancel</button>
          <button type="submit" class="form-button submit">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="./src/js/edit_student.js"></script>
</body>
</html>
