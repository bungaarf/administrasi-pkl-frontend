<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Edit Jenis Tagihan</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css" />
  <link rel="stylesheet" href="./src/css/add_student.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
<div class="app-container">
  <div class="sidebar">
    <!-- Sidebar content -->
  </div>

  <div class="app-content">
    <div class="app-content-header">
      <h1 class="app-content-headerText">Edit Jenis Tagihan</h1>
      <button class="mode-switch" title="Switch Theme">
        <svg class="moon" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" width="24" height="24" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
        </svg>
      </button>
      <button class="app-content-headerButton" onclick="window.location.href='jenis_tagihan.html'">Back</button>
    </div>

    <div class="student-form-container">
      <form id="editForm" class="student-form">
        <div class="form-section">
          <h2 class="form-section-title">Informasi Tagihan</h2>

          <div class="form-row">
            <div class="form-group">
              <label for="kelas" class="form-label">Kelas</label>
              <select id="kelas" name="kelas" class="form-select" required>
                <option value="" disabled selected>Pilih Kelas</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
              </select>
            </div>

            <div class="form-group">
              <label for="nama_tagihan" class="form-label">Nama Tagihan</label>
              <input type="text" id="nama_tagihan" name="nama_tagihan" class="form-input" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="nominal" class="form-label">Nominal</label>
              <input type="number" id="nominal" name="nominal" class="form-input" required />
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button type="button" class="form-button cancel" onclick="window.location.href='jenis_tagihan.html'">Cancel</button>
          <button type="submit" class="form-button submit">Simpan Perubahan</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="./src/js/edit_jenistagihan.js"></script>
</body>
</html>
