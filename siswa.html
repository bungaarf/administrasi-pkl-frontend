<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard Siswa - SMK Infokom Kota Bogor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <style>
      body {
        background-color: #e3f4fd;
        font-family: "Poppins", sans-serif;
        margin: 0;
        padding: 0;
      }

      .main-container {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem;
      }

      .card {
        background: white;
        padding: 2rem;
        border-radius: 15px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 500px;
        text-align: left;
      }

      .card h2 {
        text-align: center;
        color: #3dbff0;
        font-weight: 600;
        margin-bottom: 1.5rem;
      }

      label {
        font-weight: 500;
      }

      select,
      input {
        width: 100%;
        padding: 10px;
        margin: 10px 0 20px;
        border-radius: 8px;
        border: 1px solid #ccc;
      }

      .btn-primary {
        background-color: #3dbff0;
        border: none;
      }

      .btn-primary:hover {
        background-color: #1aaee4;
      }

      .btn-secondary {
        background-color: #6b7280;
        border: none;
        margin-left: 10px;
      }

      .btn-secondary:hover {
        background-color: #4b5563;
      }

      .info {
        margin-bottom: 1rem;
      }

      .info strong {
        width: 90px;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="main-container">
      <div class="card">
        <h2>Rincian Siswa</h2>
        <div class="info">
          <strong>Nama:</strong> <span id="nama">Memuat...</span>
        </div>
        <div class="info"><strong>VA:</strong> <span id="va">-</span></div>
        <div class="info">
          <strong>Jurusan:</strong> <span id="jurusan">-</span>
        </div>

        <label for="kelas">Pilih Kelas:</label>
        <select id="kelas">
          <option value="">-- Pilih Kelas --</option>
        </select>

        <div class="d-flex justify-content-between">
          <button id="btnTagihan" class="btn btn-primary" disabled>
            Rincian Tagihan
          </button>
          <button class="btn btn-secondary" onclick="history.back()">
            Kembali
          </button>
        </div>
      </div>
    </div>

    <script>
      const user = JSON.parse(localStorage.getItem("user"));
      const nis = user?.nis;
      const va = user?.va;

      if (!nis || !va) {
        alert("Siswa belum login. Silakan login ulang.");
        window.location.href = "/login.html";
      }

      document.getElementById("va").innerText = va;

      // Ambil data siswa
      fetch(`http://127.0.0.1:8000/api/siswa-nis/${nis}`)
        .then((res) => res.json())
        .then((data) => {
          document.getElementById("nama").innerText =
            data.nama || "(Tanpa Nama)";
          document.getElementById("jurusan").innerText =
            data.jurusan || "(Tanpa Jurusan)";
          document.getElementById("btnTagihan").disabled = false;
        });

      // Ambil kelas dari jenis tagihan (hanya X, XI, XII)
      fetch("http://127.0.0.1:8000/api/jenis-tagihan")
        .then((res) => res.json())
        .then((data) => {
          const kelasSet = new Set();
          data.forEach((item) => {
            if (item.kelas && [10, 11, 12].includes(item.kelas)) {
              kelasSet.add(item.kelas);
            }
          });

          const selectKelas = document.getElementById("kelas");
          [...kelasSet].sort().forEach((kelas) => {
            const option = document.createElement("option");
            option.value = kelas;
            option.textContent = `Kelas ${kelas}`;
            selectKelas.appendChild(option);
          });
        });

      document.getElementById("btnTagihan").addEventListener("click", () => {
        const kelas = document.getElementById("kelas").value;
        if (!kelas) return alert("Silakan pilih kelas terlebih dahulu.");
        window.location.href = `/rincian_tagihan.html?nis=${nis}&kelas=${encodeURIComponent(
          kelas
        )}`;
      });
    </script>
  </body>
</html>
